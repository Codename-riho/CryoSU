[package]
name = "cryo-app"
version = "0.1.0"
edition = "2021"

# Not part of the offline workspace: it needs crates.io and the Android NDK.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cryo-core = { path = "../cryo-core" }
eframe = { version = "0.29", default-features = false, features = ["android-native-activity", "glow"] }
egui = "0.29"
android-activity = { version = "0.6", features = ["native-activity"] }
log = "0.4"
android_logger = "0.14"
