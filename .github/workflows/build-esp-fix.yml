name: Build ESP Unicode Fix (LSPosed module)

on:
  push:
    paths:
      - "modules/esp-unicode-fix/**"
      - ".github/workflows/build-esp-fix.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/esp-unicode-fix
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: chmod +x gradlew && ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: ESP-Unicode-Fix
          path: modules/esp-unicode-fix/app/build/outputs/apk/release/*.apk
